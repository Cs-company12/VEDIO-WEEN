<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; width:270px; font:14px system-ui,Segoe UI,sans-serif; background:#14171d; color:#eef0f4; }
  h1 { font-size:15px; margin:0; padding:12px 14px; border-bottom:1px solid #2c313c; }
  label { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 14px; border-bottom:1px solid #2c313c; cursor:pointer; }
  label small { display:block; color:#9aa3b2; font-size:12px; margin-top:2px; }
  input { width:18px; height:18px; accent-color:#f5b301; flex:none; }
  p { margin:0; padding:10px 14px; color:#9aa3b2; font-size:12px; line-height:1.5; }
  b { color:#eef0f4; }
</style>
</head>
<body>
  <h1>🔍 Video Weyneeye + 🚫 Ad Block</h1>
  <label><span>Xir xayeysiisyada<small>Banner-ada iyo shabakadaha xayeysiiska</small></span><input type="checkbox" id="ads"></label>
  <label><span>Xir popup-yada<small>Tab-yada iyo daaqadaha is-fura</small></span><input type="checkbox" id="pops"></label>
  <label><span>Ka dami site-kan<small id="host">—</small></span><input type="checkbox" id="off"></label>
  <p>Popup-yo la xiray: <b id="count">0</b><br>Tirada ku qoran icon-ka = xayeysiisyada lagu xiray tab-kan.<br>Zoom: Alt + / Alt − / Alt 0 / Alt F</p>
  <script src="popup.js"></script>
</body>
</html>
